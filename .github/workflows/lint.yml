name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Writes compile_commands.json, which clang-tidy reads for each file's flags.
      - name: Configure
        run: cmake -S . -B build

      # Same target as locally; .clang-tidy makes any finding a failure.
      - name: Check lint
        run: cmake --build build --target lint
