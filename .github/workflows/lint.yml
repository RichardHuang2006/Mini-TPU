name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Configuring writes compile_commands.json, which clang-tidy reads for
      # each file's flags.
      - name: Configure
        run: cmake -S . -B build

      # The same target runs locally; .clang-tidy turns any finding into a
      # failure.
      - name: Check lint
        run: cmake --build build --target lint
