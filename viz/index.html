<!doctype html>
<!-- Mini-TPU visualizer: the terminal loads a program and the buttons here move it; blocks paint only occupied rows and computing PEs, and the inspector shows values. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-TPU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Mini-TPU</h1>
  <span>cycle <b id="cycle">0</b></span>
  <span>pc <b id="pc">0</b></span>
  <span>issued <b id="issued">0</b></span>
  <span id="state" class="badge">ready</span>
  <div id="controls">
    <label>go to cycle <input id="jump" type="text" size="6" spellcheck="false"></label>
    <button id="back" type="button">◀ back</button>
    <div id="unit" role="radiogroup">
      <label><input type="radio" name="unit" value="instruction" checked>instruction</label>
      <label><input type="radio" name="unit" value="cycle">cycle</label>
    </div>
    <button id="forward" type="button">forward ▶</button>
  </div>
</header>

<main>
  <div id="stage">
    <svg id="arrows" aria-hidden="true">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path>
        </marker>
      </defs>
      <path id="arrow-host-ub" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-ub-host" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-ub-mxu" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-wmem-fifo" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-fifo-mxu" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-mxu-acc" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-acc-act" class="arrow" marker-end="url(#head)"></path>
      <path id="arrow-act-ub" class="arrow" marker-end="url(#head)"></path>
    </svg>

    <section id="block-host" class="block">
      <div class="head"><h2>Host memory</h2><span id="host-status" class="status"></span></div>
      <canvas id="view-host"></canvas>
    </section>

    <section id="block-ub" class="block">
      <div class="head"><h2>Unified Buffer</h2><span id="ub-status" class="status"></span></div>
      <canvas id="view-ub"></canvas>
    </section>

    <section id="block-mxu" class="block">
      <div class="head"><h2>Matrix Multiply Unit</h2><span id="mxu-status" class="status"></span></div>
      <canvas id="view-mxu"></canvas>
    </section>

    <section id="block-wfifo" class="block">
      <div class="head"><h2>Weight FIFO</h2><span id="wfifo-status" class="status"></span></div>
      <canvas id="view-wfifo"></canvas>
    </section>

    <section id="block-wmem" class="block">
      <div class="head"><h2>Weight Memory</h2><span id="wmem-status" class="status"></span></div>
      <canvas id="view-wmem"></canvas>
    </section>

    <section id="block-act" class="block">
      <div class="head"><h2>Activation</h2><span id="act-status" class="status"></span></div>
      <div class="progress"><div id="act-bar"></div></div>
      <canvas id="view-line"></canvas>
    </section>

    <section id="block-acc" class="block">
      <div class="head"><h2>Accumulators</h2><span id="acc-status" class="status"></span></div>
      <canvas id="view-acc"></canvas>
    </section>
  </div>

  <div id="bottom">
    <section id="inspector" class="panel">
      <div class="panel-head">
        <h2>Row inspector</h2>
        <select id="left-select"></select>
        <label>row <input id="left-row" type="text" size="8" spellcheck="false"></label>
      </div>
      <div class="panel-head right-half">
        <select id="right-select"></select>
        <label>PE row <input id="right-row" type="text" size="8" spellcheck="false"></label>
        <label><input id="inspect-hex" type="checkbox">hex</label>
      </div>
      <div class="values-box">
        <canvas id="left-values"></canvas>
        <div id="left-scroll" class="values-scroll"><div id="left-spacer"></div></div>
      </div>
      <div class="values-box right-half">
        <canvas id="right-values"></canvas>
        <div id="right-scroll" class="values-scroll"><div id="right-spacer"></div></div>
      </div>
    </section>

    <section id="instructions" class="panel">
      <div class="panel-head"><h2>Instructions</h2></div>
      <ol id="program"></ol>
    </section>
  </div>

  <section id="timeline-panel" class="panel">
    <div class="panel-head"><h2>Timeline</h2><span id="timeline-readout" class="readout"></span></div>
    <canvas id="timeline"></canvas>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
